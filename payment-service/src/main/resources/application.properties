# Server
server.port=8082

# Database — payment-service owns paymentdb
spring.datasource.url=jdbc:postgresql://localhost:5432/paymentdb
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT — must match core-api secret
jwt.secret=Ccsfv0YNGBxxmLyjhEg1KoMxOFT96CAgRcxzEyWr2bA
jwt.expiration=86400000

# Razorpay
razorpay.key.id=rzp_test_SoVYVV1TZMtOdr
razorpay.key.secret=qWaLouMcefcAXHu6p3ETGdAZ

# Inter-service communication
core.api.url=http://localhost:8081
internal.service.secret=ams-internal-secret-2024

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# ============= Redis Configuration =============
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=redis_pass_123
spring.redis.timeout=2000ms
spring.redis.database=0

# Connection Pool
spring.redis.jedis.pool.max-active=20
spring.redis.jedis.pool.max-idle=10
spring.redis.jedis.pool.min-idle=5
spring.redis.jedis.pool.max-wait=-1ms

# Cache Settings
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false

# Logging
logging.level.org.springframework.cache=DEBUG
logging.level.io.lettuce=DEBUG
