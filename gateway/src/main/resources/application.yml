server:
  port: 8080

spring:
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: payment-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/payments/**,/api/bills/**,/api/maintenance-config/**,/api/admin/collections/**
        - id: core-api
          uri: http://localhost:8081
          predicates:
            - Path=/api/**
